<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Equipe Sindicompany — quem tá online</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/assets/brand/icon-color.png">
<link rel="stylesheet" href="/assets/shared.css">
<script src="/assets/shared.js"></script>
<style>
  .team-stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px;
  }
  .team-stat{
    padding:14px 16px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;
  }
  .team-stat .label{font-size:10.5px;font-weight:700;color:var(--text-dim);letter-spacing:0.05em;text-transform:uppercase}
  .team-stat .value{font-size:26px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
  .team-stat.online .value{color:#86efac}

  .team-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .team-filter{
    padding:7px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);
    border-radius:100px;color:var(--text-dim);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;
  }
  .team-filter.active{background:rgba(99,102,241,0.18);border-color:rgba(99,102,241,0.4);color:#a5b4fc}
  .team-search{
    flex:1;min-width:200px;
    padding:7px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);
    border-radius:100px;color:var(--text);font-family:inherit;font-size:13px;
  }

  .team-list{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .team-card{
    padding:14px 16px;background:rgba(255,255,255,0.03);border:1px solid var(--border);
    border-radius:12px;display:flex;align-items:center;gap:12px;
  }
  .team-card.online{border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.04)}
  .team-card.idle{border-color:rgba(245,158,11,0.25)}

  .team-avatar{
    width:42px;height:42px;border-radius:50%;flex:0 0 42px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:700;font-size:15px;
    position:relative;
  }
  .team-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .team-avatar .dot{
    position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;
    background:#71717a;border:2.5px solid #0a0a0c;
  }
  .team-card.online .team-avatar .dot{background:#10b981;box-shadow:0 0 6px #10b981}
  .team-card.idle .team-avatar .dot{background:#fbbf24}

  .team-info{flex:1;min-width:0}
  .team-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team-meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team-status{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    padding:2px 8px;border-radius:100px;
    background:rgba(255,255,255,0.05);color:var(--text-dim);
    margin-top:4px;
  }
  .team-card.online .team-status{background:rgba(34,197,94,0.15);color:#86efac}
  .team-card.idle .team-status{background:rgba(245,158,11,0.15);color:#fbbf24}

  .team-actions{display:flex;gap:4px}
  .team-action{
    width:34px;height:34px;border:1px solid var(--border);background:rgba(255,255,255,0.03);
    border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--text-dim);text-decoration:none;transition:all .15s;
  }
  .team-action:hover{background:rgba(99,102,241,0.15);color:#a5b4fc;border-color:rgba(99,102,241,0.3)}
  .team-action svg{width:16px;height:16px}

  .team-empty{padding:40px 20px;text-align:center;color:var(--text-dim);font-size:14px}
</style>
</head>
<body>
<div id="app-nav"></div>

<main class="tool-container">
  <header class="tool-hero">
    <span class="tool-eyebrow"><span class="dot"></span> Equipe · Presença</span>
    <h1>Equipe Sindicompany</h1>
    <p>Quem do time tá ativo agora. Atualiza automaticamente a cada 15 segundos.</p>
  </header>

  <div class="team-stats">
    <div class="team-stat online"><div class="label">Online agora</div><div class="value" id="stat-online">–</div></div>
    <div class="team-stat"><div class="label">No total</div><div class="value" id="stat-total">26</div></div>
    <div class="team-stat"><div class="label">Última atualização</div><div class="value" id="stat-time" style="font-size:13px;font-weight:600;color:var(--text-dim);margin-top:8px">agora</div></div>
  </div>

  <div class="team-filters">
    <button class="team-filter active" data-f="all">Todos</button>
    <button class="team-filter" data-f="online">Só online</button>
    <button class="team-filter" data-f="offline">Só offline</button>
    <input class="team-search" id="search" placeholder="Buscar pessoa…">
  </div>

  <div class="team-list" id="teamList"></div>

  <div class="tool-privacy" style="margin-top:18px">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    Presença atualiza com o heartbeat que cada navegador envia. "Online" = atividade nos últimos 60 segundos.
  </div>
</main>

<script>
const TEAM = [
  ['amanda@sindicompany.com.br', 'Amanda Queiroz', 'Atendimento'],
  ['corina@sindicompany.com.br', 'Corina Abreu', 'Gestão'],
  ['diego@sindicompany.com.br', 'Diego Leite', 'Operacional'],
  ['eduardo@sindicompany.com.br', 'Eduardo Ribeiro', 'Operacional'],
  ['felipe.fernandes@sindicompany.com.br', 'Felipe Fernandes', 'Gestão'],
  ['isabella@sindicompany.com.br', 'Isabella Nascimento', 'Atendimento'],
  ['junior@sindicompany.com.br', 'Rommel Júnior', 'Gestão'],
  ['luciane.barco@sindicompany.com.br', 'Luciane Barco', 'Diretoria'],
  ['marcia@sindicompany.com.br', 'Márcia', 'Atendimento'],
  ['marcio@sindicompany.com.br', 'Marcio Reis', 'Operacional'],
  ['miriam@sindicompany.com.br', 'Miriam Diamantino', 'Gestão'],
  ['raquel@sindicompany.com.br', 'Raquel Moura', 'Atendimento'],
  ['rose@sindicompany.com.br', 'Rose Brandão', 'Atendimento'],
  ['arquitetura@sindicompany.com.br', 'equipe Arquitetura', 'Área'],
  ['atendimento@sindicompany.com.br', 'equipe SAC', 'Área'],
  ['atendimento2@sindicompany.com.br', 'Henrique Nogueira', 'Atendimento'],
  ['comercial@sindicompany.com.br', 'By Sindicompany', 'Comercial'],
  ['contasapagar@sindicompany.com.br', 'equipe Contas a Pagar', 'Área'],
  ['engenharia@sindicompany.com.br', 'equipe Engenharia', 'Área'],
  ['engenharia1@sindicompany.com.br', 'Vitor Porto', 'Engenharia'],
  ['engenharia2@sindicompany.com.br', 'Vitor Porto', 'Engenharia'],
  ['jornal@sindicompany.com.br', 'equipe Mídias', 'Área'],
  ['operacional@sindicompany.com.br', 'equipe Operacional', 'Área'],
  ['operacional2@sindicompany.com.br', 'Bruno (Operacional)', 'Operacional'],
  ['operacional3@sindicompany.com.br', 'Silvanio (Operacional)', 'Operacional'],
  ['orcamento@sindicompany.com.br', 'equipe Orçamentos', 'Área'],
  ['mkt@sindicompany.com.br', 'equipe Marketing', 'Área'],
];

let onlineMap = new Map();
let me = '';
let filter = 'all';
let query = '';

async function refresh() {
  try {
    const r = await fetch('/api/presence', { credentials: 'include' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    me = (j.online?.find(o => o.idleSeconds === 0)?.email || '').toLowerCase();
    onlineMap = new Map();
    for (const o of j.online || []) {
      onlineMap.set(o.email.toLowerCase(), o);
    }
    document.getElementById('stat-online').textContent = j.count || 0;
    document.getElementById('stat-time').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    render();
  } catch (e) {
    console.warn('presence err', e);
  }
}

function initials(name) {
  return name.split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0]).join('').toUpperCase();
}

function statusLabel(o) {
  if (!o) return 'offline';
  const s = o.idleSeconds || 0;
  if (s < 30) return 'agora';
  if (s < 90) return `${s}s atrás`;
  return `${Math.floor(s / 60)} min atrás`;
}

function render() {
  const q = query.trim().toLowerCase();
  const list = TEAM
    .map(([email, name, role]) => ({ email, name, role, online: onlineMap.get(email) }))
    .filter(p => {
      if (filter === 'online' && !p.online) return false;
      if (filter === 'offline' && p.online) return false;
      if (q && !p.name.toLowerCase().includes(q) && !p.email.includes(q) && !p.role.toLowerCase().includes(q)) return false;
      return true;
    })
    .sort((a, b) => {
      // Online primeiro, depois alfabético
      if (!!a.online !== !!b.online) return a.online ? -1 : 1;
      return a.name.localeCompare(b.name, 'pt-BR');
    });

  const box = document.getElementById('teamList');
  if (!list.length) {
    box.innerHTML = '<div class="team-empty">Ninguém encontrado pra esse filtro.</div>';
    return;
  }
  box.innerHTML = list.map(p => {
    const isOnline = !!p.online;
    const idle = p.online?.idleSeconds || 0;
    const isIdle = isOnline && idle > 30;
    const status = isOnline ? (isIdle ? 'ausente' : 'online') : 'offline';
    const cls = isOnline ? (isIdle ? 'idle' : 'online') : '';
    const toolHint = p.online?.toolName ? ` · ${escapeHtml(p.online.toolName)}` : '';
    return `
      <div class="team-card ${cls}">
        <div class="team-avatar">${initials(p.name)}<span class="dot"></span></div>
        <div class="team-info">
          <div class="team-name">${escapeHtml(p.name)}</div>
          <div class="team-meta">${escapeHtml(p.role)}${toolHint}</div>
          <span class="team-status">${statusLabel(p.online)}</span>
        </div>
        <div class="team-actions">
          <a class="team-action" href="/tools/chat.html?dm=${encodeURIComponent(p.email)}" title="Mandar mensagem">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </a>
          <a class="team-action" href="mailto:${encodeURIComponent(p.email)}" title="Email direto">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </a>
        </div>
      </div>`;
  }).join('');
}

document.querySelectorAll('.team-filter').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.team-filter').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    filter = b.dataset.f;
    render();
  });
});
document.getElementById('search').addEventListener('input', e => {
  query = e.target.value;
  render();
});

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

refresh();
setInterval(refresh, 15000);
if (window.trackUsage) trackUsage('equipe', {});
</script>
</body>
</html>
